version: 2

models:
  - name: stg_customers
    description: "粒度: 1 行 = 1 顧客"
    columns:
      - name: customer_id
        description: 顧客の主キー
        data_tests:
          - not_null
          - unique

  - name: stg_orders
    description: "粒度: 1 行 = 1 注文"
    columns:
      - name: order_id
        description: 注文の主キー
        data_tests:
          - not_null
          - unique
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: order_total
        description: 税込の注文金額（ドル）
        data_tests:
          - not_null

  - name: stg_order_items
    description: "粒度: 1 行 = 注文明細 1 行"
    columns:
      - name: order_item_id
        description: 注文明細の主キー
        data_tests:
          - not_null
          - unique
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id

  - name: stg_products
    description: "粒度: 1 行 = 1 SKU"
    columns:
      - name: product_id
        description: SKU
        data_tests:
          - not_null
          - unique
      - name: product_price
        description: 商品単価（ドル）
        data_tests:
          - not_null

  - name: stg_supplies
    description: "粒度: 1 行 = SKU ごとの副資材 1 種。supply_id は id と sku の複合キー"
    columns:
      - name: supply_id
        data_tests:
          - not_null
          - unique
      - name: product_id
        data_tests:
          - not_null

  - name: stg_locations
    description: "粒度: 1 行 = 1 店舗"
    columns:
      - name: location_id
        data_tests:
          - not_null
          - unique
